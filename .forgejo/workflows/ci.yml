# Forgejo Actions. The runner label is set per instance; codeberg-small is
# the Codeberg one.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: codeberg-small
    env:
      CI: "true"
      # The build needs the variables to exist; nothing connects to them.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lively_forms?schema=public
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Bun
        run: |
          if ! command -v node >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y nodejs npm
          fi

          npm config set prefix "$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          npm install -g bun@1.3.13
          bun --version

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bun install --frozen-lockfile

      - name: Check formatting, tests, lint, types and build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bun run check
