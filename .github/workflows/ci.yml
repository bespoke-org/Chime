name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  DATABASE_URL: postgresql://ci:ci@localhost:5432/chime?schema=public
  AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run typecheck
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: |
          mkdir -p test-results
          bun run test --reporter=junit --reporter-outfile=test-results/unit.xml
          test -s test-results/unit.xml
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://chime:chime@127.0.0.1:5432/chime_test?schema=public
      E2E_DATABASE_URL: postgresql://chime:chime@127.0.0.1:5432/chime_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3100
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chime
          POSTGRES_PASSWORD: chime
          POSTGRES_DB: chime_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U chime -d chime_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain and dependencies
        uses: ./.github/actions/setup
      - name: Apply migrations to the test database
        run: bun x --no-install prisma migrate deploy
      - name: Build
        run: bun run build
      - name: Install Chromium
        run: bun x --no-install playwright install --with-deps chromium
      - name: Run browser tests against the production build
        run: bun run test:e2e
      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
