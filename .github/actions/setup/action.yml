name: Set up Node.js and Bun
description: Install the app toolchain and locked dependencies with a Bun download cache.

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.13"
    - name: Cache Bun packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.13-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-1.3.13-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
