services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: the-forms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_forms
      POSTGRES_USER: the_forms
      POSTGRES_PASSWORD: the_forms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_forms -d the_forms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
