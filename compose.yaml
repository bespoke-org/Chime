services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: the-forms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_forms
      POSTGRES_USER: the_forms
      POSTGRES_PASSWORD: the_forms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_forms -d the_forms"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: docker.io/dxflrs/garage:v2.4.1
    container_name: the-forms-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
